<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Skin Upgrader</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    color: white;
    background:
        radial-gradient(circle at 50% 0%, #26365e 0%, transparent 40%),
        radial-gradient(circle at 10% 80%, #30204f 0%, transparent 35%),
        linear-gradient(135deg, #080b14, #101522 50%, #090b12);
    overflow-x: hidden;
}

/* Фон */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

/* Верхняя панель */

.header {
    height: 75px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 50px;
    background: rgba(7,10,18,.8);
    border-bottom: 1px solid #29324a;
    backdrop-filter: blur(10px);
}

.logo {
    font-size: 25px;
    font-weight: 900;
}

.logo span {
    color: #ffb52e;
}

.balance {
    background: #151b2a;
    border: 1px solid #303a55;
    border-radius: 12px;
    padding: 12px 22px;
    font-size: 18px;
}

/* Основная часть */

.container {
    width: 1100px;
    max-width: 95%;
    margin: 50px auto;
}

.title {
    text-align: center;
    font-size: 38px;
    font-weight: 900;
}

.subtitle {
    text-align: center;
    color: #78839f;
    margin-top: 8px;
}

/* Апгрейд */

.upgrader {
    margin-top: 45px;
}

.selected {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 70px;
}

.weapon {
    width: 260px;
    height: 200px;
    background: linear-gradient(145deg, #171d2d, #0e121d);
    border: 1px solid #343e58;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: 0 15px 40px rgba(0,0,0,.3);
}

.weapon-icon {
    font-size: 80px;
    margin-bottom: 15px;
}

.weapon-name {
    font-size: 20px;
    font-weight: bold;
}

.weapon-price {
    color: #8c98b5;
    margin-top: 5px;
}

.arrow {
    font-size: 45px;
    color: #ffb52e;
}

/* Рулетка */

.roulette-wrapper {
    position: relative;
    margin-top: 35px;
    overflow: hidden;
    border-radius: 18px;
    border: 1px solid #333d58;
    background: #0c101a;
    box-shadow: inset 0 0 50px rgba(0,0,0,.7);
}

.pointer {
    position: absolute;
    z-index: 10;
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 25px solid #ffb52e;
    filter: drop-shadow(0 0 8px #ffb52e);
}

.roulette {
    height: 180px;
    display: flex;
    align-items: center;
    width: max-content;
    transform: translateX(0);
}

.card {
    width: 150px;
    height: 140px;
    margin: 0 6px;
    flex-shrink: 0;
    border-radius: 12px;
    border: 1px solid #3b455f;
    background: linear-gradient(145deg,#1c2334,#111622);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.card-icon {
    font-size: 52px;
}

.card-name {
    font-size: 13px;
    margin-top: 8px;
    font-weight: bold;
}

.card-price {
    color: #8894b2;
    font-size: 12px;
    margin-top: 4px;
}

/* Редкость */

.blue {
    border-bottom: 4px solid #4d8cff;
}

.purple {
    border-bottom: 4px solid #a95cff;
}

.pink {
    border-bottom: 4px solid #e94cff;
}

.red {
    border-bottom: 4px solid #ff4545;
}

.gold {
    border-bottom: 4px solid #ffbf32;
}

/* Кнопка */

.controls {
    margin-top: 30px;
    text-align: center;
}

.upgrade-btn {
    width: 330px;
    max-width: 90%;
    height: 60px;
    border: none;
    border-radius: 13px;
    color: white;
    font-size: 20px;
    font-weight: 900;
    cursor: pointer;
    background: linear-gradient(90deg,#ff9d1c,#ffc14a);
    box-shadow: 0 8px 25px rgba(255,166,35,.2);
    transition: .2s;
}

.upgrade-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 35px rgba(255,166,35,.35);
}

.upgrade-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

/* Шанс */

.chance {
    margin-top: 20px;
    text-align: center;
    color: #8c97b0;
}

.chance span {
    color: #64df9b;
    font-weight: bold;
}

/* Нижние карточки */

.inventory {
    margin-top: 55px;
}

.inventory-title {
    font-size: 22px;
    margin-bottom: 15px;
}

.inventory-grid {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 12px;
}

.inventory-item {
    height: 120px;
    background: #121725;
    border: 1px solid #29334c;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.inventory-item div {
    font-size: 45px;
}

.inventory-item p {
    font-size: 12px;
    color: #9aa5bd;
    margin-top: 7px;
}

/* Анимация */

@keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    50% { transform: translateX(5px); }
    75% { transform: translateX(-3px); }
    100% { transform: translateX(0); }
}

.shake {
    animation: shake .15s infinite;
}

/* Мобильная версия */

@media(max-width:700px) {

    .header {
        padding: 0 15px;
    }

    .selected {
        gap: 10px;
    }

    .weapon {
        width: 145px;
        height: 150px;
    }

    .weapon-icon {
        font-size: 55px;
    }

    .arrow {
        font-size: 25px;
    }

    .inventory-grid {
        grid-template-columns: repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header class="header">

    <div class="logo">
        SKIN<span>UP</span>
    </div>

    <div class="balance">
        💰 <span id="balance">5000</span>
    </div>

</header>


<main class="container">

    <h1 class="title">SKIN UPGRADER</h1>

    <p class="subtitle">
        Попробуй улучшить свой скин
    </p>


    <section class="upgrader">

        <div class="selected">

            <div class="weapon">

                <div class="weapon-icon">
                    🔫
                </div>

                <div class="weapon-name">
                    AK-47 | Elite
                </div>

                <div class="weapon-price">
                    $1.25
                </div>

            </div>


            <div class="arrow">
                ➜
            </div>


            <div class="weapon">

                <div class="weapon-icon" id="resultIcon">
                    ❓
                </div>

                <div class="weapon-name" id="resultName">
                    ?
                </div>

                <div class="weapon-price" id="resultPrice">
                    ?
                </div>

            </div>

        </div>


        <!-- РУЛЕТКА -->

        <div class="roulette-wrapper">

            <div class="pointer"></div>

            <div class="roulette" id="roulette">

            </div>

        </div>


        <div class="controls">

            <button
                class="upgrade-btn"
                id="upgradeBtn"
                onclick="startUpgrade()">

                UPGRADE

            </button>

        </div>


        <div class="chance">
            Шанс на получение:
            <span id="chance">72%</span>
        </div>

    </section>


    <section class="inventory">

        <div class="inventory-title">
            Твои скины
        </div>

        <div class="inventory-grid">

            <div class="inventory-item">
                <div>🔫</div>
                <p>AK-47 Elite</p>
            </div>

            <div class="inventory-item">
                <div>🔪</div>
                <p>Knife Night</p>
            </div>

            <div class="inventory-item">
                <div>🔫</div>
                <p>AWP Redline</p>
            </div>

            <div class="inventory-item">
                <div>🔫</div>
                <p>M4A1-S Blue</p>
            </div>

            <div class="inventory-item">
                <div>🔫</div>
                <p>Glock Fade</p>
            </div>

        </div>

    </section>

</main>


<script>

const skins = [

    {
        name: "Glock Blue",
        icon: "🔫",
        price: "$2.40",
        rarity: "blue"
    },

    {
        name: "M4A1-S Ocean",
        icon: "🔫",
        price: "$5.80",
        rarity: "blue"
    },

    {
        name: "AK-47 Neon",
        icon: "🔫",
        price: "$8.20",
        rarity: "purple"
    },

    {
        name: "AWP Redline",
        icon: "🔫",
        price: "$14.50",
        rarity: "pink"
    },

    {
        name: "AK-47 Fire",
        icon: "🔥",
        price: "$28.00",
        rarity: "pink"
    },

    {
        name: "Karambit Night",
        icon: "🔪",
        price: "$55.00",
        rarity: "red"
    },

    {
        name: "Butterfly Fade",
        icon: "🦋",
        price: "$120.00",
        rarity: "red"
    },

    {
        name: "Dragon Lore",
        icon: "🐉",
        price: "$500.00",
        rarity: "gold"
    }

];


const roulette =
    document.getElementById("roulette");


function createCard(skin) {

    const card =
        document.createElement("div");

    card.className =
        "card " + skin.rarity;

    card.innerHTML = `

        <div class="card-icon">
            ${skin.icon}
        </div>

        <div class="card-name">
            ${skin.name}
        </div>

        <div class="card-price">
            ${skin.price}
        </div>

    `;

    return card;
}


// Заполняем рулетку

function createRoulette() {

    roulette.innerHTML = "";

    // много карточек для длинной рулетки

    for(let i = 0; i < 80; i++) {

        const random =
            skins[Math.floor(Math.random() * skins.length)];

        roulette.appendChild(
            createCard(random)
        );

    }

}

createRoulette();


let balance = 5000;

const balanceElement =
    document.getElementById("balance");

const button =
    document.getElementById("upgradeBtn");


function startUpgrade() {

    const price = 100;

    if(balance < price) {

        alert("Недостаточно денег!");

        return;

    }


    balance -= price;

    balanceElement.textContent =
        balance;

    button.disabled = true;

    button.textContent =
        "UPGRADING...";


    roulette.classList.add("shake");


    // Сначала возвращаем рулетку

    roulette.style.transition =
        "none";

    roulette.style.transform =
        "translateX(0)";


    setTimeout(() => {

        roulette.classList.remove("shake");

        // Получаем случайный скин

        const result =
            skins[Math.floor(Math.random() * skins.length)];


        // Центральная позиция

        const cardWidth = 162;

        const targetIndex = 65;

        const randomOffset =
            Math.floor(Math.random() * 50) - 25;

        const move =
            -(targetIndex * cardWidth)
            + randomOffset;


        roulette.style.transition =
            "transform 5s cubic-bezier(.08,.6,0,1)";

        roulette.style.transform =
            `translateX(${move}px)`;


        setTimeout(() => {

            document.getElementById("resultIcon")
                .textContent = result.icon;

            document.getElementById("resultName")
                .textContent = result.name;

            document.getElementById("resultPrice")
                .textContent = result.price;


            button.disabled = false;

            button.textContent =
                "UPGRADE";


            updateChance(result);

        }, 5100);

    }, 300);

}


function updateChance(result) {

    let chance = 72;

    if(result.rarity === "blue")
        chance = 72;

    if(result.rarity === "purple")
        chance = 22;

    if(result.rarity === "pink")
        chance = 5;

    if(result.rarity === "red")
        chance = 0.9;

    if(result.rarity === "gold")
        chance = 0.1;

    document.getElementById("chance")
        .textContent = chance + "%";

}

</script>

</body>
</html>
